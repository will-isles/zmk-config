# SplitKB Aurora Sofle — left half (Nice!Nano). CONFIG_ZMK_SPLIT* from build.yaml cmake-args.

# Bluetooth (optional parity with Aurora Corne halves)
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Per-key RGB (SK6812MINI-E chain); white at boot (HSV: hue ignored when sat=0)
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=65
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0

# Rotary encoders (upstream shield.conf; keymap uses sensor-bindings)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
