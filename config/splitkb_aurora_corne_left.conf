# Configuration for SplitKB Aurora Corne - Left Half

# Display configuration for nice!view
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# Use built-in status screen: custom screen on split peripheral pulls nice_view
# widgets that do not link cleanly on ZMK main (peripheral_status / entropy).
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=n

# Display widgets (only widgets available on peripheral halves)
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_PERIPHERAL_STATUS=n

# Bluetooth configuration
# Disable 2M PHY for better compatibility with older devices
CONFIG_BT_CTLR_PHY_2M=n
# Experimental BLE features (currently disabled)
# CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Increase Bluetooth transmit power to +8dBm for better range
# This helps maintain connection stability, especially for split keyboards
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

