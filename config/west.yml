manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pin to a release tag when published (e.g. v0.4.0); use the same ref in
      # .github/workflows/build.yml (build-user-config.yml@<tag>).
      revision: main
      import: app/west.yml
  self:
    path: config
