# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano//zmk" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: nice_nano//zmk
#     shield: reviung41
#     artifact-name: reviung41_nano
#   - board: nice_nano//zmk
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: xiao_ble//zmk
    shield: splitkb_aurora_corne_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_dongle

  - board: nice_nano//zmk
    shield: splitkb_nice_view_spi splitkb_aurora_corne_left nice_view_adapter nice_view splitkb_aurora_i2c_off
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_left

  - board: nice_nano//zmk
    shield: splitkb_nice_view_spi splitkb_aurora_corne_right nice_view_adapter nice_view splitkb_aurora_i2c_off
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: corne_right

  - board: nice_nano//zmk
    shield: splitkb_aurora_sofle_left
    # Left must be BLE central (host + split link); do not copy Corne halves' CENTRAL=n (dongle is central there).
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: sofle_left

  - board: nice_nano//zmk
    shield: splitkb_aurora_sofle_right
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: sofle_right

  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: reset_xiao

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: reset_nano
